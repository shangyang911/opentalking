log_level: INFO
auth:
  enabled: true
  cookie_secure: false
  session_hours: 24
  sms_daily_limit: 100
  sms_provider: tencent
mysql:
  host: localhost
  port: 3306
  user: ""
  password: ""
  database: opentalking
tencent_sms:
  region: ap-guangzhou
api:
  host: 0.0.0.0
  port: 8000
  cors_origins:
    - http://localhost:5173
    - http://127.0.0.1:5173
infrastructure:
  redis_url: redis://localhost:6379/0
  avatars_dir: ./examples/avatars
  worker_url: http://127.0.0.1:9001
streaming:
  enabled: false
  control_token: ""
  allow_local_targets: false
  allowed_hosts: ""
  allowed_cidrs: ""
  max_outputs_per_session: 4
  queue_max_frames: 128
  queue_max_audio_ms: 2000
  reconnect_max_attempts: 10
  reconnect_max_delay_sec: 30
  connect_timeout_sec: 10
  write_timeout_sec: 10
  video_fps: 25
  audio_sample_rate: 48000
  audio_tick_ms: 20
  rtmps_tls_verify: true
  rtmps_ca_file: ""
  whip_tls_verify: true
  whip_ca_file: ""
  whip_max_redirects: 2
  whip_trickle_ice: false
  whip_ice_servers: ""
  whip_candidate_policy: allowlist
  internal_control_token: ""
  test_auth_bypass: false
  snapshot_ttl_sec: 3600
llm:
  base_url: ""
  api_key: ""
  model: qwen-flash
  system_prompt: You are a friendly digital human assistant.
tts:
  voice: zh-CN-XiaoxiaoNeural
  sample_rate: 16000
  streaming_decode: true
memory:
  provider: none
  enabled: false
  default_profile_id: default
  default_library_id: default
  recall_limit: 5
  recall_min_score: 0.0
  recall_timeout_ms: 2000
  recall_backend: hybrid
  write_mode: hybrid
  decision_mode: hybrid
  decision_timeout_ms: 2000
  smart_write_enabled: true
  summary_enabled: true
  summary_turn_window: 8
  summary_max_items: 3
  sqlite_path: ./data/opentalking_memory.sqlite3
model:
  torch_device: cpu
  default_model: quicktalk
models:
  mock:
    backend: mock
  quicktalk:
    backend: local
