name: CI

permissions:
  contents: read

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install System Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install -U pip setuptools wheel
          pip install torch==2.10.0 torchvision==0.25.0 torchaudio==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -e "./backend[dev]"

      - name: Lint
        run: >
          ruff check
          --config backend/pyproject.toml
          backend/opentalking/core
          backend/opentalking/events
          backend/opentalking/avatar
          backend/apps/api
          backend/apps/unified
          backend/apps/cli
          backend/tests

      - name: Type Check
        run: >
          mypy
          --config-file backend/pyproject.toml
          backend/opentalking/core
          backend/opentalking/events
          backend/opentalking/avatar
          backend/apps/api
          backend/apps/unified
          backend/apps/cli
          --ignore-missing-imports

      - name: Test
        run: python scripts/ci_pytest.py backend/tests frontend/tests/regression

  package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build Python Package
        run: |
          python -m pip install -U pip build twine
          python -m build backend --outdir dist
          python -m twine check dist/*

      - name: Check Package Contents
        run: |
          python - <<'PY'
          import tarfile
          import zipfile
          from pathlib import Path

          wheel = next(Path("dist").glob("*.whl"))
          sdist = next(Path("dist").glob("*.tar.gz"))

          with zipfile.ZipFile(wheel) as archive:
              wheel_tests = [
                  name for name in archive.namelist()
                  if name.startswith("tests/")
              ]

          with tarfile.open(sdist) as archive:
              sdist_tests = [
                  name for name in archive.getnames()
                  if "/tests/api/" in name
              ]

          if wheel_tests or sdist_tests:
              raise SystemExit(
                  "Package artifacts must not include backend/tests/api files."
              )
          PY

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm test && npm run typecheck && npm run build

  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python Dependencies
        run: |
          python -m pip install -U pip setuptools wheel
          pip install -e "./backend[dev]"
          pip install -r docs/requirements.txt

      - name: Build Docs
        run: python -m mkdocs build --strict --clean

  publish:
    name: Publish production images
    needs: [backend, frontend, package, docs]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      api_image: ${{ steps.images.outputs.api_image }}
      web_image: ${{ steps.images.outputs.web_image }}
    env:
      IMAGE_PREFIX: ${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/opentalking
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Build and publish API
        id: api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.production
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-api:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=production-api
          cache-to: type=gha,scope=production-api,mode=max
      - name: Build and publish web
        id: web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.web
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-web:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=production-web
          cache-to: type=gha,scope=production-web,mode=max
      - name: Record immutable image references
        id: images
        env:
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
        run: |
          echo "api_image=${IMAGE_PREFIX}-api@${API_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "web_image=${IMAGE_PREFIX}-web@${WEB_DIGEST}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to Alibaba ECS
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    concurrency:
      group: production-ecs
      cancel-in-progress: false
    steps:
      - name: Deploy the tested commit
        env:
          DEPLOY_HOST: ${{ secrets.ECS_HOST }}
          DEPLOY_USER: ${{ secrets.ECS_USER }}
          DEPLOY_KEY: ${{ secrets.ECS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.ECS_KNOWN_HOSTS }}
          REGISTRY_TOKEN: ${{ secrets.ACR_PASSWORD }}
          API_IMAGE: ${{ needs.publish.outputs.api_image }}
          WEB_IMAGE: ${{ needs.publish.outputs.web_image }}
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_KEY KNOWN_HOSTS REGISTRY_TOKEN API_IMAGE WEB_IMAGE; do
            test -n "${!name}" || { echo "Missing deployment setting: $name" >&2; exit 1; }
          done
          directory=$(mktemp -d "$RUNNER_TEMP/ecs-ssh.XXXXXX")
          trap 'rm -rf -- "$directory"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$directory/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$directory/known_hosts"
          chmod 600 "$directory/key" "$directory/known_hosts"
          printf '%s\n' "$REGISTRY_TOKEN" | ssh -T -i "$directory/key" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$directory/known_hosts" \
            -o ConnectTimeout=20 -o ServerAliveInterval=30 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo -n /usr/local/sbin/opentalking-deploy '$GITHUB_SHA' '$API_IMAGE' '$WEB_IMAGE'"
          echo "Deployed commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
