name: CI

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install System Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install -U pip setuptools wheel
          pip install -e "./backend[dev]"

      - name: Lint
        run: >
          ruff check
          --config backend/pyproject.toml
          backend/opentalking/core
          backend/opentalking/events
          backend/opentalking/avatar
          backend/apps/api
          backend/apps/unified
          backend/apps/cli
          backend/tests

      - name: Type Check
        run: >
          mypy
          --config-file backend/pyproject.toml
          backend/opentalking/core
          backend/opentalking/events
          backend/opentalking/avatar
          backend/apps/api
          backend/apps/unified
          backend/apps/cli
          --ignore-missing-imports

      - name: Test
        run: pytest backend/tests frontend/tests/regression

  package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build Python Package
        run: |
          python -m pip install -U pip build twine
          python -m build backend --outdir dist
          python -m twine check dist/*

      - name: Check Package Contents
        run: |
          python - <<'PY'
          import tarfile
          import zipfile
          from pathlib import Path

          wheel = next(Path("dist").glob("*.whl"))
          sdist = next(Path("dist").glob("*.tar.gz"))

          with zipfile.ZipFile(wheel) as archive:
              wheel_tests = [
                  name for name in archive.namelist()
                  if name.startswith("tests/")
              ]

          with tarfile.open(sdist) as archive:
              sdist_tests = [
                  name for name in archive.getnames()
                  if "/tests/api/" in name
              ]

          if wheel_tests or sdist_tests:
              raise SystemExit(
                  "Package artifacts must not include backend/tests/api files."
              )
          PY

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm test && npm run typecheck && npm run build

  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python Dependencies
        run: |
          python -m pip install -U pip setuptools wheel
          pip install -e "./backend[dev]"
          pip install -r docs/requirements.txt

      - name: Build Docs
        run: python -m mkdocs build --strict --clean
